spring.application.name=llm-playground

# Secrets (OPENROUTER_API_KEY, DB_PASSWORD, ...) come only from environment variables
# or from the .env file in the working directory, never from this file.
spring.config.import=optional:file:.env[.properties]

# ============================================================
#  Which provider to use: ollama | openrouter (or both: ollama,openrouter)
#  Set CHAT_PROVIDERS in .env. Models of a disabled provider are hidden
#  in the form and rejected even when typed by hand.
# ============================================================
playground.providers=${CHAT_PROVIDERS:ollama}

# ============================================================
#  Models shown on the "new comparison" page (checked by default)
#  Format: provider:model, provider = openrouter | ollama
#  Models of a disabled provider are simply not shown.
# ============================================================
playground.models[0]=openrouter:anthropic/claude-haiku-5.5
playground.models[1]=openrouter:openai/gpt-5-mini
playground.models[2]=ollama:llama3.2:3b
playground.models[3]=ollama:qwen3:8b

# Default generation parameters (can be changed in the form for each run)
playground.temperature=0.2
playground.max-tokens=2048
playground.runs-per-prompt=1
# streaming is needed to measure time to first token
playground.streaming=true
# Ollama: one warm-up call per model, stored with cold_start=true and excluded from timing
playground.warmup=true

# Reasoning models spend tokens on hidden thinking: give them headroom,
# otherwise they return an empty answer with finish_reason=length.
# These override the max-tokens of the form for that model.
playground.model-overrides[0].model=openrouter:deepseek/deepseek-r1-0528
playground.model-overrides[0].max-tokens=8192
playground.model-overrides[1].model=ollama:qwen3:8b
playground.model-overrides[1].max-tokens=8192

# HTTP timeouts and Spring AI retries: a failed call must not hang for minutes
playground.http.connect-timeout=10s
playground.http.read-timeout=180s
spring.http.client.connect-timeout=${playground.http.connect-timeout}
spring.http.client.read-timeout=${playground.http.read-timeout}
spring.http.reactiveclient.connect-timeout=${playground.http.connect-timeout}
spring.http.reactiveclient.read-timeout=${playground.http.read-timeout}
spring.ai.retry.max-attempts=2
spring.ai.retry.on-client-errors=false
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=5s

# Ask OpenRouter /api/v1/generation for the exact cost of each call
playground.openrouter.fetch-cost=true
playground.app-version=@project.version@

# ============================================================
#  Web UI: local only, it can spend OpenRouter credits
# ============================================================
server.address=127.0.0.1
server.port=1509
spring.thymeleaf.cache=false

# ============================================================
#  Providers
# ============================================================
# OpenRouter is OpenAI-compatible. No /v1 here: Spring AI appends /v1/chat/completions itself.
spring.ai.openai.base-url=https://openrouter.ai/api
# Without a key OpenRouterKeyPlaceholder substitutes a placeholder: the app starts (Ollama works)
# and OpenRouter calls fail with a clear ERROR.
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.init.pull-model-strategy=never
# Both chat models are created, our LlmGateway picks one per call; everything else is off.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.chat.client.enabled=false

# ============================================================
#  PostgreSQL (schema owned by Flyway)
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

logging.level.org.springframework.ai=WARN
